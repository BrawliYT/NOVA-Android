name: NOVA Android CI and release

on:
  push:
    branches: [main]
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Validate project/tag version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION" ]; then
            echo 'Could not read versionName from app/build.gradle.kts' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#android-v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Android tag $TAG_VERSION does not match project version $VERSION" >&2
              exit 1
            fi
          fi
          echo "Android version: $VERSION"
          echo "NOVA_ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK for CI/test
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        uses: actions/upload-artifact@v6
        with:
          name: NOVA-Android-${{ env.NOVA_ANDROID_VERSION }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check Android signing secrets
        if: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret for Android signing: $name" >&2
              exit 1
            fi
          done

      - name: Prepare Android signing key
        if: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-android-release.keystore"
          echo "NOVA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nova-android-release.keystore" >> "$GITHUB_ENV"
          echo "NOVA_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NOVA_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NOVA_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Publish Android GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "app/build/outputs/apk/release/app-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NOVA Android $NOVA_ANDROID_VERSION" \
            --notes "NOVA Android $NOVA_ANDROID_VERSION. Built by GitHub Actions from tag $GITHUB_REF_NAME."
